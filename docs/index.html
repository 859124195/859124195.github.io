<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" href="data:,">
<title>同学状态与需求了解表（匿名 · 自愿）</title>
<style>
  :root {
    --primary: #1565C0;
    --primary-light: #E8F1FB;
    --text: #1F2937;
    --text-2: #6B7280;
    --line: #E5E7EB;
    --bg: #F5F7FA;
    --card: #FFFFFF;
    --amber-bg: #FFF8EC;
    --amber-text: #92400E;
    --amber-line: #F5D9A8;
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.7; font-size: 16px;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 20px 16px 48px; }

  /* ---------- 头部 ---------- */
  .hero { padding: 12px 4px 4px; }
  .hero .tag {
    display: inline-block; font-size: 12px; color: var(--primary); background: var(--primary-light);
    border-radius: 999px; padding: 3px 12px; margin-bottom: 12px; font-weight: 600; letter-spacing: .5px;
  }
  .hero h1 { font-size: 22px; line-height: 1.4; margin-bottom: 14px; }
  .intro {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 16px 18px; font-size: 14.5px; color: var(--text);
  }
  .intro .from { margin-top: 10px; color: var(--text-2); font-size: 13.5px; }

  /* ---------- 进度 ---------- */
  .progress-box { margin: 18px 4px 6px; }
  .progress-box .label { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-2); margin-bottom: 6px; }
  .progress-track { height: 8px; background: #E5E9F0; border-radius: 999px; overflow: hidden; }
  .progress-fill { height: 100%; width: 0; background: var(--primary); border-radius: 999px; transition: width .25s ease; }

  /* ---------- 分区与题目 ---------- */
  .section-title {
    font-size: 15px; font-weight: 700; color: var(--primary);
    margin: 26px 4px 12px; display: flex; align-items: center; gap: 8px;
  }
  .section-title::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .q-card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 16px 18px; margin-bottom: 12px;
  }
  .q-title { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
  .q-hint { font-size: 12.5px; color: var(--text-2); margin-bottom: 10px; }
  .q-hint .skip { color: #9CA3AF; }
  .opt {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    border: 1px solid var(--line); background: #FAFBFC; border-radius: 10px;
    padding: 11px 14px; margin-top: 8px; font-size: 15px; color: var(--text); cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .opt:active { transform: scale(.99); }
  .opt .mark {
    width: 20px; height: 20px; border-radius: 50%; border: 2px solid #C4CDD9;
    flex: none; display: flex; align-items: center; justify-content: center;
    font-size: 12px; color: #fff; background: transparent; transition: all .15s;
  }
  .opt.box .mark { border-radius: 6px; }
  .opt.on { border-color: var(--primary); background: var(--primary-light); }
  .opt.on .mark { border-color: var(--primary); background: var(--primary); }
  .opt.on .mark::after { content: "✓"; font-weight: 700; }
  .opt.dim { opacity: .45; }

  /* 评分 */
  .rating-row { display: flex; gap: 8px; margin-top: 10px; }
  .rating-btn {
    flex: 1; aspect-ratio: 1/1; max-height: 56px; border: 1px solid var(--line); background: #FAFBFC;
    border-radius: 10px; font-size: 17px; font-weight: 600; color: var(--text-2); cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: all .15s;
  }
  .rating-btn.on { border-color: var(--primary); background: var(--primary); color: #fff; }
  .rating-scale { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-2); margin-top: 6px; }
  .rating-now { font-size: 13px; color: var(--primary); margin-top: 6px; min-height: 20px; font-weight: 600; }

  textarea {
    width: 100%; border: 1px solid var(--line); border-radius: 10px; background: #FAFBFC;
    padding: 10px 12px; font-size: 15px; font-family: inherit; line-height: 1.6; color: var(--text);
    resize: vertical; min-height: 72px; margin-top: 8px;
  }
  textarea:focus { outline: none; border-color: var(--primary); background: #fff; }

  /* ---------- 提交 ---------- */
  .submit-btn {
    display: block; width: 100%; margin-top: 26px; border: none; border-radius: 12px;
    background: var(--primary); color: #fff; font-size: 17px; font-weight: 700; padding: 15px;
    cursor: pointer; transition: opacity .15s;
  }
  .submit-btn:disabled { opacity: .55; cursor: default; }
  .foot-note { text-align: center; font-size: 12.5px; color: #9CA3AF; margin-top: 14px; }

  /* ---------- 结果视图 ---------- */
  .view { display: none; }
  .view.show { display: block; }
  .result-card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 28px 22px; text-align: center; margin-top: 24px;
  }
  .result-card .icon {
    width: 56px; height: 56px; border-radius: 50%; background: var(--primary-light);
    color: var(--primary); font-size: 28px; display: flex; align-items: center; justify-content: center;
    margin: 0 auto 14px;
  }
  .result-card h2 { font-size: 19px; margin-bottom: 10px; }
  .result-card p { font-size: 14.5px; color: var(--text); }
  .hotlines { margin-top: 18px; text-align: left; background: var(--amber-bg); border: 1px solid var(--amber-line); border-radius: 12px; padding: 14px 16px; }
  .hotlines .hl-title { font-size: 13.5px; font-weight: 700; color: var(--amber-text); margin-bottom: 8px; }
  .hotlines .hl-row { display: flex; justify-content: space-between; font-size: 14px; padding: 5px 0; color: var(--text); }
  .hotlines .hl-row b { color: var(--amber-text); letter-spacing: .5px; }
  .hotlines .hl-note { font-size: 12px; color: var(--amber-text); opacity: .85; margin-top: 8px; }

  .err-card {
    background: #FEF2F2; border: 1px solid #FECACA; border-radius: var(--radius);
    padding: 20px 18px; margin-top: 24px; font-size: 14.5px; color: #991B1B;
  }
  .err-card b { display: block; margin-bottom: 8px; font-size: 15.5px; }
  .err-actions { display: flex; gap: 10px; margin-top: 14px; }
  .err-actions button {
    flex: 1; border-radius: 10px; padding: 11px; font-size: 14.5px; cursor: pointer; font-weight: 600;
  }
  .btn-retry { border: none; background: var(--primary); color: #fff; }
  .btn-copy { border: 1px solid #FCA5A5; background: #fff; color: #991B1B; }

  .toast {
    position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%) translateY(20px);
    background: rgba(17, 24, 39, .92); color: #fff; font-size: 14px; padding: 10px 18px;
    border-radius: 999px; opacity: 0; pointer-events: none; transition: all .25s; z-index: 99;
    max-width: 82vw; text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .resubmit-banner {
    background: var(--primary-light); border: 1px solid #BBD5F0; color: #0D47A1;
    border-radius: 10px; padding: 10px 14px; font-size: 13px; margin-top: 14px;
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- 填写视图 -->
  <div id="view-form" class="view show">
    <div class="hero">
      <span class="tag">心理委员 · 匿名收集</span>
      <h1 id="survey-title"></h1>
      <div class="intro">
        <p id="survey-intro"></p>
        <p class="from">—— 你的心理委员</p>
      </div>
      <div id="resubmit-banner" class="resubmit-banner" style="display:none">
        这台设备之前提交过一次。如果情况有变化，可以重新填写再次提交（以最新一次为准）。
      </div>
    </div>

    <div class="progress-box">
      <div class="label"><span>完成进度</span><span id="progress-text">已答 0 / 14</span></div>
      <div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div>
    </div>

    <form id="survey-form"></form>

    <button id="btn-submit" class="submit-btn" type="button">匿名提交</button>
    <p class="foot-note">不填姓名 · 自愿填写 · 任何题目可跳过 · 结果仅心理委员本人可见</p>
  </div>

  <!-- 成功视图 -->
  <div id="view-success" class="view">
    <div class="result-card">
      <div class="icon">✓</div>
      <h2>提交成功，谢谢你</h2>
      <p id="outro-text"></p>
      <div class="hotlines">
        <div class="hl-title">心理支持渠道</div>
        <div id="hotline-rows"></div>
        <div class="hl-note" id="outro-note"></div>
      </div>
      <p style="margin-top:16px;color:var(--text-2);font-size:13.5px" id="outro-tail"></p>
    </div>
  </div>

  <!-- 失败视图 -->
  <div id="view-error" class="view">
    <div class="err-card">
      <b>提交没有成功</b>
      可能是网络临时波动。你可以点“重试一次”；如果还是不行，点“复制我的答案”，把内容通过微信发给心理委员，效果一样。
      <div class="err-actions">
        <button class="btn-retry" type="button" onclick="location.reload()">重试一次</button>
        <button class="btn-copy" type="button" id="btn-copy-answers">复制我的答案</button>
      </div>
    </div>
  </div>

</div>
<div id="toast" class="toast"></div>

<script src="https://class-survey-65603.app.workbuddy.host/survey-config.js?sharecode=XOCZKP7CMC"></script>
<script src="cloud-mini.js"></script>
<script>
(function () {
  'use strict';

  /* ---------- 静态文案 ---------- */
  document.getElementById('survey-title').textContent = SURVEY.title;
  document.getElementById('survey-intro').textContent = SURVEY.intro;
  document.getElementById('outro-text').textContent = SURVEY.outro;
  document.getElementById('outro-tail').textContent = SURVEY.outroTail;
  document.getElementById('outro-note').textContent = SURVEY.outroNote;
  document.getElementById('hotline-rows').innerHTML = HOTLINES.map(function (h) {
    return '<div class="hl-row"><span>' + h.name + '</span><b>' + h.value + '</b></div>';
  }).join('');

  /* ---------- 状态 ---------- */
  var state = {};            // qid -> 字符串 / 数字 / 数组
  var form = document.getElementById('survey-form');

  /* ---------- 渲染表单 ---------- */
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function renderForm() {
    var html = '';
    var lastSection = -1;
    SURVEY.questions.forEach(function (q, idx) {
      if (q.section !== lastSection) {
        lastSection = q.section;
        html += '<div class="section-title">' + esc(SURVEY.sections[q.section]) + '</div>';
      }
      html += '<div class="q-card" data-q="' + q.id + '">';
      html += '<div class="q-title">' + (idx + 1) + '. ' + esc(q.title) + '</div>';
      var hint = q.hint ? esc(q.hint) + ' · ' : '';
      html += '<div class="q-hint">' + hint + '<span class="skip">可跳过</span></div>';

      if (q.type === 'radio' || q.type === 'checkbox') {
        q.options.forEach(function (opt) {
          html += '<button type="button" class="opt' + (q.type === 'checkbox' ? ' box' : '') +
                  '" data-q="' + q.id + '" data-opt="' + esc(opt) + '">' +
                  '<span class="mark"></span><span>' + esc(opt) + '</span></button>';
        });
      } else if (q.type === 'rating') {
        html += '<div class="rating-row">';
        for (var v = q.min; v <= q.max; v++) {
          html += '<button type="button" class="rating-btn" data-q="' + q.id + '" data-opt="' + v + '">' + v + '</button>';
        }
        html += '</div>';
        html += '<div class="rating-scale"><span>1 = ' + esc(q.minLabel) + '</span><span>5 = ' + esc(q.maxLabel) + '</span></div>';
        html += '<div class="rating-now" id="rating-now-' + q.id + '"></div>';
      } else if (q.type === 'text') {
        html += '<textarea data-q="' + q.id + '" rows="3" placeholder="' + (q.id === 'q14' ? '方便留联系方式的话写在这里；不方便写“不需要”也可以' : '简单写几句就好（选填）') + '"></textarea>';
      }
      html += '</div>';
    });
    form.innerHTML = html;
  }

  /* ---------- 选项点击 ---------- */
  form.addEventListener('click', function (e) {
    var btn = e.target.closest('.opt, .rating-btn');
    if (!btn) return;
    var qid = btn.getAttribute('data-q');
    var q = SURVEY.questions.filter(function (x) { return x.id === qid; })[0];

    if (q.type === 'radio' || q.type === 'rating') {
      state[qid] = q.type === 'rating' ? Number(btn.getAttribute('data-opt')) : btn.getAttribute('data-opt');
      refreshQ(qid);
    } else if (q.type === 'checkbox') {
      var opt = btn.getAttribute('data-opt');
      var arr = state[qid] || [];
      var i = arr.indexOf(opt);
      if (i >= 0) {
        arr.splice(i, 1);
      } else {
        if (q.max && arr.length >= q.max) {
          toast('最多选 ' + q.max + ' 项');
          return;
        }
        arr.push(opt);
      }
      state[qid] = arr;
      refreshQ(qid);
    }
    updateProgress();
  });

  form.addEventListener('input', function (e) {
    var ta = e.target.closest('textarea');
    if (!ta) return;
    var qid = ta.getAttribute('data-q');
    var v = ta.value.trim();
    if (v) state[qid] = v; else delete state[qid];
    updateProgress();
  });

  /* ---------- 刷新单题显示 ---------- */
  function refreshQ(qid) {
    var q = SURVEY.questions.filter(function (x) { return x.id === qid; })[0];
    var card = form.querySelector('.q-card[data-q="' + qid + '"]');
    if (q.type === 'radio' || q.type === 'rating') {
      card.querySelectorAll('.opt, .rating-btn').forEach(function (b) {
        var on = String(b.getAttribute('data-opt')) === String(state[qid]);
        b.classList.toggle('on', on);
      });
      if (q.type === 'rating') {
        var now = document.getElementById('rating-now-' + qid);
        now.textContent = state[qid] ? (state[qid] + ' 分 · ' + q.scaleLabels[state[qid]]) : '';
      }
    } else if (q.type === 'checkbox') {
      var arr = state[qid] || [];
      card.querySelectorAll('.opt').forEach(function (b) {
        var on = arr.indexOf(b.getAttribute('data-opt')) >= 0;
        b.classList.toggle('on', on);
        b.classList.toggle('dim', !on && q.max && arr.length >= q.max);
      });
    }
  }

  /* ---------- 进度 ---------- */
  function answeredCount() {
    return SURVEY.questions.filter(function (q) {
      var v = state[q.id];
      return v !== undefined && v !== null && !(Array.isArray(v) && v.length === 0) && v !== '';
    }).length;
  }
  function updateProgress() {
    var n = answeredCount();
    document.getElementById('progress-text').textContent = '已答 ' + n + ' / ' + SURVEY.questions.length;
    document.getElementById('progress-fill').style.width = (n / SURVEY.questions.length * 100) + '%';
  }

  /* ---------- 提示 ---------- */
  var toastTimer = null;
  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 1800);
  }

  /* ---------- 提交 ---------- */
  function collectAnswers() {
    var out = {};
    SURVEY.questions.forEach(function (q) {
      var v = state[q.id];
      if (v === undefined || v === null) return;
      if (Array.isArray(v) && v.length === 0) return;
      if (typeof v === 'string' && v.trim() === '') return;
      out[q.id] = v;
    });
    return out;
  }

  function showView(id) {
    ['view-form', 'view-success', 'view-error'].forEach(function (v) {
      document.getElementById(v).classList.toggle('show', v === id);
    });
    window.scrollTo(0, 0);
  }

  var lastAnswersText = '';

  document.getElementById('btn-submit').addEventListener('click', function () {
    var answers = collectAnswers();
    var btn = this;
    btn.disabled = true;
    btn.textContent = '正在提交…';

    var cloud;
    try {
      cloud = initCloud();
    } catch (err) {
      btn.disabled = false;
      btn.textContent = '匿名提交';
      lastAnswersText = formatAnswersText(answers);
      showView('view-error');
      return;
    }

    // 注意：不要链 .select()——本表对匿名用户只开 INSERT 策略（结果仅心理委员可读），
    // INSERT ... RETURNING 会触发 SELECT 策略检查导致整条插入被 RLS 拒绝。
    cloud.database.from(TABLE_NAME).insert({ answers: answers })
      .then(function (res) {
        if (res.error) throw res.error;
        try { localStorage.setItem('class-survey-submitted', new Date().toISOString()); } catch (e) {}
        showView('view-success');
      })
      .catch(function (err) {
        console.error(err);
        btn.disabled = false;
        btn.textContent = '匿名提交';
        lastAnswersText = formatAnswersText(answers);
        showView('view-error');
      });
  });

  function formatAnswersText(answers) {
    var lines = ['【我的了解表回答】'];
    SURVEY.questions.forEach(function (q, i) {
      var v = answers[q.id];
      if (v === undefined) return;
      if (Array.isArray(v)) v = v.join('、');
      lines.push((i + 1) + '. ' + q.title + '：' + v);
    });
    return lines.join('\n');
  }

  document.getElementById('btn-copy-answers').addEventListener('click', function () {
    var text = lastAnswersText || formatAnswersText(collectAnswers());
    function done() { toast('已复制，发给心理委员即可'); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text); done(); });
    } else {
      fallbackCopy(text); done();
    }
  });
  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
  }

  /* ---------- 初始化 ---------- */
  renderForm();
  updateProgress();
  try {
    if (localStorage.getItem('class-survey-submitted')) {
      document.getElementById('resubmit-banner').style.display = 'block';
    }
  } catch (e) {}
})();
</script>
</body>
</html>
