<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" href="data:,">
<title>了解表 · 结果统计（仅心理委员）</title>
<style>
  :root {
    --primary: #1565C0;
    --primary-light: #E8F1FB;
    --text: #1F2937;
    --text-2: #6B7280;
    --line: #E5E7EB;
    --bg: #F5F7FA;
    --card: #FFFFFF;
    --red-bg: #FEF2F2;
    --red-line: #FECACA;
    --red-text: #991B1B;
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.7; font-size: 16px;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 20px 16px 56px; }
  .view { display: none; }
  .view.show { display: block; }

  /* ---------- 密码门禁 ---------- */
  .gate {
    max-width: 420px; margin: 72px auto 0; background: var(--card);
    border: 1px solid var(--line); border-radius: var(--radius); padding: 32px 26px; text-align: center;
  }
  .gate .lock {
    width: 52px; height: 52px; border-radius: 50%; background: var(--primary-light);
    color: var(--primary); font-size: 24px; display: flex; align-items: center; justify-content: center; margin: 0 auto 14px;
  }
  .gate h1 { font-size: 19px; margin-bottom: 6px; }
  .gate p { font-size: 13.5px; color: var(--text-2); margin-bottom: 18px; }
  .gate input {
    width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px;
    font-size: 16px; text-align: center; letter-spacing: 1px; font-family: inherit; margin-bottom: 12px;
  }
  .gate input:focus { outline: none; border-color: var(--primary); }
  .gate button {
    width: 100%; border: none; border-radius: 10px; background: var(--primary); color: #fff;
    font-size: 16px; font-weight: 700; padding: 12px; cursor: pointer;
  }
  .gate button:disabled { opacity: .55; cursor: default; }
  .gate .err { color: var(--red-text); font-size: 13.5px; margin-top: 10px; min-height: 20px; }

  /* ---------- 结果页 ---------- */
  .topbar {
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
    padding: 8px 2px 14px;
  }
  .topbar h1 { font-size: 20px; }
  .topbar .meta { font-size: 13px; color: var(--text-2); width: 100%; }
  .top-actions { display: flex; gap: 8px; }
  .btn {
    border: 1px solid var(--line); background: var(--card); color: var(--text);
    border-radius: 10px; padding: 8px 14px; font-size: 14px; cursor: pointer; font-weight: 600;
  }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }

  .redline {
    background: var(--red-bg); border: 1px solid var(--red-line); border-radius: 12px;
    padding: 12px 16px; font-size: 13.5px; color: var(--red-text); margin-bottom: 18px;
  }
  .redline b { display: block; margin-bottom: 2px; }

  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .stat-card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .stat-card .k { font-size: 12.5px; color: var(--text-2); }
  .stat-card .v { font-size: 24px; font-weight: 700; color: var(--primary); margin-top: 2px; }
  .stat-card .v small { font-size: 13px; color: var(--text-2); font-weight: 500; }

  .q-stat { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 12px; }
  .q-stat h3 { font-size: 15.5px; margin-bottom: 12px; }
  .q-stat h3 .n { color: var(--text-2); font-weight: 500; font-size: 13px; margin-left: 6px; }
  .bar-row { display: flex; align-items: center; gap: 10px; margin-top: 8px; font-size: 14px; }
  .bar-row .name { flex: none; width: 118px; color: var(--text); }
  .bar-row .track { flex: 1; height: 16px; background: #EEF1F5; border-radius: 5px; overflow: hidden; }
  .bar-row .fill { height: 100%; background: var(--primary); border-radius: 5px; min-width: 0; transition: width .3s; }
  .bar-row .num { flex: none; width: 74px; text-align: right; color: var(--text-2); font-size: 13px; }

  .text-list { margin-top: 4px; }
  .text-item {
    background: #FAFBFC; border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 14px; font-size: 14px; margin-top: 8px; color: var(--text);
  }
  .text-item .t { font-size: 11.5px; color: #9CA3AF; margin-top: 4px; }
  .empty-tip { font-size: 13.5px; color: var(--text-2); padding: 6px 0; }

  .section-label { font-size: 15px; font-weight: 700; color: var(--primary); margin: 24px 2px 12px; }
</style>
</head>
<body>
<div class="wrap">

  <!-- 密码门禁 -->
  <div id="view-gate" class="view show">
    <div class="gate">
      <div class="lock">🔒</div>
      <h1>了解表 · 结果统计</h1>
      <p>此页面仅心理委员本人可查看。请输入查看密码。</p>
      <input id="pwd-input" type="password" placeholder="查看密码" autocomplete="current-password">
      <button id="btn-unlock" type="button">进入</button>
      <div class="err" id="gate-err"></div>
    </div>
  </div>

  <!-- 结果视图 -->
  <div id="view-result" class="view">
    <div class="topbar">
      <h1>了解表 · 结果统计</h1>
      <div class="top-actions">
        <button class="btn" id="btn-refresh" type="button">刷新</button>
        <button class="btn primary" id="btn-export" type="button">导出 CSV</button>
      </div>
      <div class="meta" id="result-meta"></div>
    </div>

    <div class="redline">
      <b>红线提醒</b>
      结果保密：不转发、不发群、不进共享大表；只以班级整体汇总形式反馈。不下诊断、不单独点名；持续低状态或异常信号按“发现 → 陪伴 → 转介 → 跟踪”处理，并报告辅导员。
    </div>

    <div class="stat-grid" id="stat-grid"></div>
    <div id="stats-body"></div>
  </div>

</div>

<script src="https://class-survey-65603.app.workbuddy.host/survey-config.js?sharecode=XOCZKP7CMC"></script>
<script src="cloud-mini.js"></script>
<script>
(function () {
  'use strict';

  var gateErr = document.getElementById('gate-err');
  var pwdInput = document.getElementById('pwd-input');
  var unlockBtn = document.getElementById('btn-unlock');
  var rows = null; // 最近一次取到的数据

  function showView(id) {
    ['view-gate', 'view-result'].forEach(function (v) {
      document.getElementById(v).classList.toggle('show', v === id);
    });
  }

  function unlock() {
    var pwd = pwdInput.value.trim();
    if (!pwd) { gateErr.textContent = '请输入密码'; return; }
    unlockBtn.disabled = true;
    unlockBtn.textContent = '正在进入…';
    gateErr.textContent = '';

    var cloud;
    try {
      cloud = initCloud();
    } catch (e) {
      unlockBtn.disabled = false;
      unlockBtn.textContent = '进入';
      gateErr.textContent = '页面组件加载失败，请检查网络后刷新重试';
      return;
    }

    cloud.database.rpc('get_survey_results', { pwd: pwd })
      .then(function (res) {
        if (res.error) throw res.error;
        rows = res.data || [];
        render();
        showView('view-result');
      })
      .catch(function (err) {
        console.error(err);
        gateErr.textContent = '密码不正确，或网络异常，请重试';
      })
      .then(function () {
        unlockBtn.disabled = false;
        unlockBtn.textContent = '进入';
      });
  }

  unlockBtn.addEventListener('click', unlock);
  pwdInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') unlock(); });
  document.getElementById('btn-refresh').addEventListener('click', function () {
    // 刷新：回门禁页清空密码，重新取数
    pwdInput.value = '';
    gateErr.textContent = '';
    showView('view-gate');
  });

  /* ---------- 渲染 ---------- */
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function fmtTime(iso) {
    var d = new Date(iso);
    function p(n) { return (n < 10 ? '0' : '') + n; }
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  function render() {
    var n = rows.length;
    document.getElementById('result-meta').textContent =
      '共回收 ' + n + ' 份 · 数据更新于 ' + fmtTime(new Date().toISOString()) + ' · 匿名数据';

    /* 顶部指标卡 */
    var q4vals = rows.map(function (r) { return r.answers && r.answers.q4; })
                     .filter(function (v) { return typeof v === 'number' && v > 0; });
    var q4avg = q4vals.length ? (q4vals.reduce(function (a, b) { return a + b; }, 0) / q4vals.length) : null;
    var q14count = rows.filter(function (r) { return r.answers && r.answers.q14 && String(r.answers.q14).trim() && String(r.answers.q14) !== '不需要'; }).length;

    document.getElementById('stat-grid').innerHTML =
      statCard('回收份数', n + ' <small>份</small>') +
      statCard('学习生活适应度均分', q4avg === null ? '—' : q4avg.toFixed(1) + ' <small>/ 5（' + q4vals.length + ' 人作答）</small>') +
      statCard('愿意单独聊（留了联系方式）', q14count + ' <small>人</small>');

    /* 各题统计 */
    var html = '';
    var lastSection = -1;
    SURVEY.questions.forEach(function (q, idx) {
      if (q.section !== lastSection) {
        lastSection = q.section;
        html += '<div class="section-label">' + esc(SURVEY.sections[q.section]) + '</div>';
      }
      html += '<div class="q-stat"><h3>' + (idx + 1) + '. ' + esc(q.title) +
              '<span class="n">' + qTypeName(q.type) + '</span></h3>';

      if (q.type === 'text') {
        var items = rows.filter(function (r) {
          var v = r.answers && r.answers[q.id];
          return v && String(v).trim() && String(v).trim() !== '不需要';
        });
        if (items.length === 0) {
          html += '<div class="empty-tip">暂无填写</div>';
        } else {
          html += '<div class="text-list">';
          items.forEach(function (r) {
            html += '<div class="text-item">' + esc(String(r.answers[q.id]).trim()) +
                    '<div class="t">' + fmtTime(r.created_at) + ' 提交</div></div>';
          });
          html += '</div>';
        }
      } else {
        var counts = {};
        q.options ? q.options.forEach(function (o) { counts[o] = 0; }) : null;
        if (q.type === 'rating') { for (var v = q.min; v <= q.max; v++) counts[v] = 0; }
        var answered = 0;
        rows.forEach(function (r) {
          var a = r.answers && r.answers[q.id];
          if (a === undefined || a === null || a === '') return;
          answered++;
          if (Array.isArray(a)) {
            a.forEach(function (x) { if (counts[x] !== undefined) counts[x]++; });
          } else if (counts[a] !== undefined) {
            counts[a]++;
          }
        });
        var max = Math.max.apply(null, Object.keys(counts).map(function (k) { return counts[k]; }).concat([1]));
        Object.keys(counts).forEach(function (k) {
          var c = counts[k];
          var pct = n ? Math.round(c / n * 100) : 0;
          html += '<div class="bar-row"><span class="name">' + esc(k) + '</span>' +
                  '<span class="track"><span class="fill" style="width:' + (c / max * 100) + '%"></span></span>' +
                  '<span class="num">' + c + ' 人 · ' + pct + '%</span></div>';
        });
        html += '<div class="empty-tip" style="margin-top:8px">' + answered + ' 人作答' +
                (q.type === 'checkbox' && q.max ? '（最多选 ' + q.max + ' 项）' : '') + '</div>';
      }
      html += '</div>';
    });
    document.getElementById('stats-body').innerHTML = html;
  }

  function statCard(k, v) {
    return '<div class="stat-card"><div class="k">' + k + '</div><div class="v">' + v + '</div></div>';
  }
  function qTypeName(t) {
    return { radio: '单选', checkbox: '多选', rating: '评分', text: '填空' }[t] || '';
  }

  /* ---------- 导出 CSV ---------- */
  document.getElementById('btn-export').addEventListener('click', function () {
    if (!rows) return;
    var header = ['提交时间'].concat(SURVEY.questions.map(function (q, i) {
      return (i + 1) + '.' + q.title;
    }));
    var lines = [header];
    rows.forEach(function (r) {
      var line = [fmtTime(r.created_at)];
      SURVEY.questions.forEach(function (q) {
        var v = r.answers ? r.answers[q.id] : '';
        if (v === undefined || v === null) v = '';
        if (Array.isArray(v)) v = v.join('、');
        line.push(String(v).replace(/"/g, '""'));
      });
      lines.push(line);
    });
    var csv = '\uFEFF' + lines.map(function (l) {
      return l.map(function (c) { return '"' + c + '"'; }).join(',');
    }).join('\r\n');
    var blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '班级了解表_结果_' + new Date().toISOString().slice(0, 10) + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  });
})();
</script>
</body>
</html>
